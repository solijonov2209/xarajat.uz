services:
  - type: web
    name: xarajat-uz
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: xarajat-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
